<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" class="field-map-svg" role="group" aria-labelledby="field-map-title" aria-describedby="field-map-desc">
 <title id="field-map-title">A map of social simulation</title>
 <desc id="field-map-desc">Individuals, interactions, and societies are connected scales of social simulation. Choose Silicon participants, Social science experiments, or Multi-agent interaction to filter papers. A shared research cycle connects human evidence, modeling, simulation, and evaluation; calibration feeds back into the model. Evaluate and Calibrate open the Evaluation and Control and calibration topics.</desc>
 <defs><style>
 .field-map-paper{fill:#fbfcf8}.field-map-ink{fill:#18281f}.field-map-muted{fill:#536257}
 .field-map-line{fill:none;stroke:#c9d8c7;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
 .field-map-orbit{fill:none;stroke:#dce8d8;stroke-width:1.5}
 .field-map-edge{fill:none;stroke:#9cbaa0;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
 .field-map-accent{fill:none;stroke:#287044;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
 .field-map-node{fill:#fbfcf8;stroke:#287044;stroke-width:1.8}
 .field-map-solid{fill:#287044;stroke:#fbfcf8;stroke-width:2.2}
 .field-map-label{fill:#18281f;font-size:35px;font-weight:600;letter-spacing:-.8px}
 .field-map-copy{fill:#536257;font-size:26px;letter-spacing:-.4px}
 .field-map-step{fill:#18281f;font-size:28px;font-weight:500;letter-spacing:-.4px}
 .field-map-text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  /* Keep type steady across states; only the artwork and marker move. */
 .field-map-label{fill:#30332e;font-size:26px;font-weight:500;letter-spacing:-.45px}
 .field-map-topic{fill:#666b62;font-size:19px;letter-spacing:-.15px}
 .field-map-cue{fill:#6d6c65;font-size:19px;letter-spacing:-.15px}
 .field-map-svg .field-topic-link,
 .field-map-svg .field-topic-link:is(:hover,:focus-visible,:active){cursor:pointer;outline:none;text-decoration:none}
 .field-map-hit{fill:transparent;stroke:transparent;stroke-width:1.25;pointer-events:all}
 .field-map-art{transform:translateY(0);transition:transform 280ms cubic-bezier(.2,.7,.2,1)}
 .field-map-topic,.field-map-label,.field-map-key{transition:fill 220ms ease}
 .field-map-underline{fill:none;stroke:#989f92;stroke-width:1.5;stroke-linecap:round;opacity:.45;transform:scaleX(.55);transform-box:fill-box;transform-origin:center;transition:transform 260ms cubic-bezier(.2,.7,.2,1),opacity 220ms ease,stroke 220ms ease}
 @media (hover:hover) and (pointer:fine){
  .field-map-svg .field-topic-link:hover .field-map-art{transform:translateY(-1.5px)}
  .field-map-svg .field-topic-link:hover .field-map-topic{fill:#303b32}
  .field-map-svg .field-topic-link:hover .field-map-underline{opacity:1;transform:scaleX(.85);stroke:#627a69}
 }
 .field-map-svg .field-topic-link[aria-current="true"] .field-map-topic{fill:#3f5d49}
 .field-map-svg .field-topic-link[aria-current="true"] .field-map-underline{opacity:1;transform:scaleX(1);stroke:#627a69}
 .field-map-svg .field-topic-link[aria-current="true"] .field-map-key{fill:#456651}
 .field-map-svg .field-topic-link:focus-visible .field-map-hit{stroke:#627a69}
 .field-map-svg .field-topic-link:focus-visible .field-map-underline{opacity:1;transform:scaleX(1)}
 .field-map-svg .field-topic-link:active .field-map-art{transform:translateY(0);transition-duration:100ms}
 @media (prefers-reduced-motion:reduce){
  .field-map-svg *{transition:none!important}
  .field-map-svg .field-topic-link .field-map-art{transform:none!important}
 }
 @media (forced-colors:active){
  .field-map-svg .field-topic-link:focus-visible .field-map-hit{stroke:Highlight}
  .field-map-svg .field-topic-link[aria-current="true"] .field-map-underline{stroke:Highlight;stroke-width:3}
 }
 .field-map-step{fill:#536257;font-size:20px;font-weight:400;letter-spacing:-.15px}
 </style>
