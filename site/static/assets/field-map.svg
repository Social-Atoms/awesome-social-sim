<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" class="field-map-svg" role="img" aria-labelledby="field-map-title field-map-desc">
 <title id="field-map-title">A map of social simulation</title>
 <desc id="field-map-desc">Individuals, interactions, and societies are connected levels of social simulation. Beliefs and decisions, relations and coordination, and collective patterns influence one another. Human evidence informs a shared cycle of modeling, simulation, evaluation, and refinement across every level.</desc>
