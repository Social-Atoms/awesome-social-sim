 <title id="field-map-title">Explore social simulation by topic</title>
 <desc id="field-map-desc">Individuals, interactions, and societies are connected scales of social simulation. Choose one of five reading entry points: silicon participants, social science experiments, multi-agent interaction, control and calibration, or evaluation. Human evidence grounds work across every scale.</desc>

