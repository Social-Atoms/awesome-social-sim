 <title id="field-mobile-title">A map of social simulation</title>
 <desc id="field-mobile-desc">Individuals, interactions, and societies are connected levels of social simulation. Beliefs and decisions, relations and coordination, and collective patterns influence one another. Human evidence informs a shared cycle of modeling, simulation, evaluation, and refinement across every level.</desc>
