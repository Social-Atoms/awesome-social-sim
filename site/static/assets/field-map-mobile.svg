<svg xmlns="http://www.w3.org/2000/svg" width="440" height="660" viewBox="0 0 440 660" class="field-mobile-svg" role="group" aria-labelledby="field-mobile-title" aria-describedby="field-mobile-desc">
 <title id="field-mobile-title">A map of social simulation</title>
 <desc id="field-mobile-desc">Individuals, interactions, and societies are connected scales of social simulation. Choose Silicon participants, Social science experiments, or Multi-agent interaction to filter papers. A shared research cycle connects human evidence, modeling, simulation, and evaluation; calibration feeds back into the model. Evaluate, Calibrate, and Position papers and surveys open their respective topics.</desc>
 <defs>
  <style>
   .field-mobile-svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
   .field-mobile-paper{fill:#fbfcf8}.field-mobile-ink{fill:#18281f}.field-mobile-muted{fill:#536257}
   .field-mobile-line{fill:none;stroke:#c9d8c7;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
   .field-mobile-orbit{fill:none;stroke:#dce8d8;stroke-width:1.5}
   .field-mobile-edge{fill:none;stroke:#9cbaa0;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
   .field-mobile-accent{fill:none;stroke:#287044;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
   .field-mobile-node{fill:#fbfcf8;stroke:#287044;stroke-width:1.8}
   .field-mobile-solid{fill:#287044;stroke:#fbfcf8;stroke-width:2.2}
   .field-mobile-label{fill:#18281f;font-size:27px;font-weight:600;letter-spacing:-.6px}
   .field-mobile-copy{fill:#536257;font-size:18.5px;letter-spacing:-.3px}
   .field-mobile-step{fill:#18281f;font-size:18.5px;font-weight:500;letter-spacing:-.3px}
   /* Keep type steady across states; only the artwork and marker move. */
 .field-mobile-label{fill:#30332e;font-size:26px;font-weight:500;letter-spacing:-.45px}
 .field-mobile-topic{fill:#666b62;font-size:18.5px;letter-spacing:-.15px}
 .field-mobile-cue{fill:#6d6c65;font-size:17.5px;letter-spacing:-.15px}
 .field-mobile-svg .field-topic-link,
 .field-mobile-svg .field-topic-link:is(:hover,:focus-visible,:active){cursor:pointer;outline:none;text-decoration:none}
 .field-mobile-hit{fill:transparent;stroke:transparent;stroke-width:1.25;pointer-events:all}
 .field-mobile-art{transform:translateY(0);transition:transform 280ms cubic-bezier(.2,.7,.2,1)}
 .field-mobile-topic,.field-mobile-label,.field-mobile-key{transition:fill 220ms ease}
 .field-mobile-underline{fill:none;stroke:#989f92;stroke-width:1.5;stroke-linecap:round;opacity:.45;transform:scaleX(.55);transform-box:fill-box;transform-origin:center;transition:transform 260ms cubic-bezier(.2,.7,.2,1),opacity 220ms ease,stroke 220ms ease}
 @media (hover:hover) and (pointer:fine){
  .field-mobile-svg .field-topic-link:hover .field-mobile-art{transform:translateY(-1.5px)}
  .field-mobile-svg .field-topic-link:hover .field-mobile-topic{fill:#303b32}
  .field-mobile-svg .field-topic-link:hover .field-mobile-underline{opacity:1;transform:scaleX(.85);stroke:#627a69}
 }
 .field-mobile-svg .field-topic-link[aria-current="true"] .field-mobile-topic{fill:#3f5d49}
 .field-mobile-svg .field-topic-link[aria-current="true"] .field-mobile-underline{opacity:1;transform:scaleX(1);stroke:#627a69}
 .field-mobile-svg .field-topic-link[aria-current="true"] .field-mobile-key{fill:#456651}
 .field-mobile-svg .field-topic-link:focus-visible .field-mobile-hit{stroke:#627a69}
 .field-mobile-svg .field-topic-link:focus-visible .field-mobile-underline{opacity:1;transform:scaleX(1)}
 .field-mobile-svg .field-topic-link:active .field-mobile-art{transform:translateY(0);transition-duration:100ms}
 @media (prefers-reduced-motion:reduce){
  .field-mobile-svg *{transition:none!important}
  .field-mobile-svg .field-topic-link .field-mobile-art{transform:none!important}
 }
 @media (forced-colors:active){
  .field-mobile-svg .field-topic-link:focus-visible .field-mobile-hit{stroke:Highlight}
  .field-mobile-svg .field-topic-link[aria-current="true"] .field-mobile-underline{stroke:Highlight;stroke-width:3}
 }
 .field-mobile-scale .field-mobile-underline{transform-origin:left}
 .field-mobile-step{fill:#536257;font-size:18.5px;font-weight:400;letter-spacing:-.15px}
 </style>
