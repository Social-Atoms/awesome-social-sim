<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" class="research-loop-svg" role="img" aria-labelledby="research-loop-title research-loop-desc">
  <title id="research-loop-title">From human evidence to a tested social simulation</title>
  <desc id="research-loop-desc">A research workflow starts with human evidence, uses it to design agents and their environment, produces simulated behavior, then evaluates that behavior against human evidence. Evaluation feeds back into agent and environment design through calibration and revision. Plausible behavior is a hypothesis; fidelity needs evidence.</desc>
  <defs>
    <marker id="research-loop-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 7 4 1 7" fill="none" stroke="#9baa9c" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="research-loop-return-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 7 4 1 7" fill="none" stroke="#58844f" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .research-loop-svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:#fff}
      .research-loop-svg .research-loop-card{fill:#fbfcfa;stroke:#dfe5dc;stroke-width:1}
      .research-loop-svg .research-loop-number{fill:#15803d;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:17px}
      .research-loop-svg .research-loop-heading{fill:#111110;font-size:21px;font-weight:600;letter-spacing:-.25px}
      .research-loop-svg .research-loop-copy{fill:#55544e;font-size:16px}
      .research-loop-svg .research-loop-rule{fill:none;stroke:#a8b5a6;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round}
      .research-loop-svg .research-loop-icon{fill:none;stroke:#53784f;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <text x="24" y="29" fill="#64715f" font-size="16" letter-spacing="1.1">A RESEARCH WORKFLOW</text>
  <rect x="24" y="52" width="224" height="182" rx="7" class="research-loop-card"/>
  <rect x="280" y="52" width="224" height="182" rx="7" class="research-loop-card"/>
  <rect x="536" y="52" width="224" height="182" rx="7" class="research-loop-card"/>
  <rect x="792" y="52" width="224" height="182" rx="7" fill="#f3f7ef" stroke="#c8dabb" stroke-width="1"/>
  <path d="M255 143h18" class="research-loop-rule" marker-end="url(#research-loop-arrow)"/>
  <path d="M511 143h18" class="research-loop-rule" marker-end="url(#research-loop-arrow)"/>
  <path d="M767 143h18" class="research-loop-rule" marker-end="url(#research-loop-arrow)"/>

  <text x="45" y="88" class="research-loop-number">01</text>
  <g class="research-loop-icon" aria-hidden="true">
    <path d="M208 71h19v24h-19zM213 78h9M213 83h9M213 88h5"/>
    <path d="M202 76v24h19"/>
  </g>
  <text x="45" y="128" class="research-loop-heading">Human</text>
  <text x="45" y="153" class="research-loop-heading">evidence</text>
  <text x="45" y="187" class="research-loop-copy">Surveys, experiments</text>
  <text x="45" y="209" class="research-loop-copy">and behavioral traces</text>

  <text x="301" y="88" class="research-loop-number">02</text>
  <g class="research-loop-icon" aria-hidden="true">
    <path d="M461 72v24M471 72v24M481 72v24M456 79h10M466 90h10M476 81h10"/>
    <circle cx="461" cy="79" r="3" fill="#fbfcfa"/><circle cx="471" cy="90" r="3" fill="#fbfcfa"/><circle cx="481" cy="81" r="3" fill="#fbfcfa"/>
  </g>
  <text x="301" y="128" class="research-loop-heading">Agent &amp;</text>
  <text x="301" y="153" class="research-loop-heading">environment design</text>
  <text x="301" y="187" class="research-loop-copy">Personas, reasoning,</text>
  <text x="301" y="209" class="research-loop-copy">rules and interactions</text>

  <text x="557" y="88" class="research-loop-number">03</text>
  <g class="research-loop-icon" aria-hidden="true">
    <path d="M713 93h29M716 88l7-7 7 4 10-13"/>
    <circle cx="716" cy="88" r="2" fill="#fbfcfa"/><circle cx="723" cy="81" r="2" fill="#fbfcfa"/><circle cx="730" cy="85" r="2" fill="#fbfcfa"/><circle cx="740" cy="72" r="2" fill="#fbfcfa"/>
  </g>
  <text x="557" y="128" class="research-loop-heading">Simulated</text>
  <text x="557" y="153" class="research-loop-heading">behavior</text>
  <text x="557" y="187" class="research-loop-copy">Choices, conversations</text>
  <text x="557" y="209" class="research-loop-copy">and population patterns</text>

  <text x="813" y="88" class="research-loop-number">04</text>
  <g class="research-loop-icon" aria-hidden="true">
    <path d="M971 73v23M963 84h29M977 76v17M984 79v12M991 82v8"/>
    <circle cx="971" cy="84" r="3" fill="#f3f7ef"/>
  </g>
  <text x="813" y="128" class="research-loop-heading">Human-grounded</text>
  <text x="813" y="153" class="research-loop-heading">evaluation</text>
  <text x="813" y="187" class="research-loop-copy">Individual fit, group</text>
  <text x="813" y="209" class="research-loop-copy">patterns and uncertainty</text>

  <path d="M904 234v32a14 14 0 0 1-14 14H406a14 14 0 0 1-14-14v-32" fill="none" stroke="#709369" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#research-loop-return-arrow)"/>
  <rect x="548" y="263" width="202" height="33" rx="4" fill="#fff"/>
  <text x="649" y="286" text-anchor="middle" fill="#356e33" font-size="17" font-weight="500">Calibrate and revise</text>

  <text x="520" y="338" text-anchor="middle" fill="#55544e" font-size="18">Plausible behavior is a hypothesis. <tspan fill="#245e2e" font-weight="500">Fidelity needs evidence.</tspan></text>
</svg>
