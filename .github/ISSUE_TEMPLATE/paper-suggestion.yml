name: Suggest a paper
description: Propose a paper for the collection. No code changes needed.
title: "[Paper] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve the collection. Please check for duplicates and read the [selection criteria](https://github.com/Social-Atoms/awesome-social-sim/blob/main/CONTRIBUTING.md#what-we-include). We include published or verifiably accepted research on simulated human behavior and social interaction, plus selected position papers and surveys. Standalone preprints and workshop-only papers are outside the current scope.
  - type: input
    id: title
    attributes:
      label: Paper title
      placeholder: Full title as published
    validations:
      required: true
  - type: input
    id: paper_url
    attributes:
      label: Paper URL
      description: Prefer the proceedings or publisher page; use a preprint link only for accepted work awaiting proceedings.
      placeholder: https://...
    validations:
      required: true
  - type: input
    id: venue
    attributes:
      label: Venue, year, and publication status
      description: Name the venue and status. For ACL, EMNLP, or NAACL, specify Main or Findings.
      placeholder: EMNLP 2025 Main; or ACL 2025 Findings
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Paper and status evidence
      description: Link the paper source and, for published or accepted work, a source confirming venue and status.
    validations:
      required: true
  - type: dropdown
    id: topics
    attributes:
      label: Relevant topics
      description: Select the topics supported by the paper's main contribution.
      multiple: true
      options:
        - Control and calibration
        - Evaluation
        - Silicon participants
        - Social science experiments
        - Multi-agent interaction
        - Position papers and surveys
    validations:
      required: true
  - type: textarea
    id: contribution
    attributes:
      label: Why does this paper belong?
      description: In one or two sentences, describe the simulated behavior, method, or evaluation and how it fits the topics you selected.
    validations:
      required: true
  - type: textarea
    id: resources
    attributes:
      label: Additional resources or context
      description: Optional project, code, benchmark, or data links. Include sources for any awards or earlier workshop appearances you mention.
